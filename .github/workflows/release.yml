name: Release

# Depois que o CI passa na main, calcula a versão pelos commits (Conventional
# Commits, regras em .github/scripts/next-version.sh), gera os executáveis de
# Linux, Windows e macOS e publica a Release. Sem commit que gere versão
# (docs, chore, ci...), nada é gerado.
# Execução manual: gera os arquivos como artefatos; com "publicar" marcado,
# publica a Release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publicar a Release (a versão sai dos commits desde a última tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.6

jobs:
  version:
    name: Calcular a versão
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.next.outputs.version }}
      semver: ${{ steps.next.outputs.semver }}
      previous: ${{ steps.next.outputs.previous }}
      build: ${{ steps.next.outputs.build }}
      release: ${{ steps.next.outputs.release }}
    steps:
      - name: Commit a publicar
        id: sha
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - name: Próxima versão
        id: next
        env:
          PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
        run: |
          eval "$(bash .github/scripts/next-version.sh)"
          release=false
          version=dev
          if [ "$bump" != none ] && [ "$PUBLISH" = true ]; then
            release=true
            version=$next
          fi
          build=$release
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && build=true
          {
            echo "version=$version"
            echo "semver=${next#v}"
            echo "previous=$previous"
            echo "release=$release"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Versão anterior: ${previous:-nenhuma}. Mudança: $bump. Próxima: $next. Publicar: $release." >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    needs: version
    if: needs.version.outputs.build == 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev liblzma-dev
      - name: Cache do Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/build/**/cargokit_build
          key: rust-${{ runner.os }}-release-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-release-
      - run: flutter pub get
      - run: flutter build linux --release --build-name=${{ needs.version.outputs.semver }} --build-number=${{ github.run_number }}
      - name: Montar o AppImage
        run: |
          mkdir -p AppDir/usr/bin dist
          cp -r build/linux/x64/release/bundle/. AppDir/usr/bin/
          cp assets/icon/app_icon.png AppDir/insight-matrix.png
          cat > AppDir/insight-matrix.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Insight Matrix
          Comment=Cliente de mensageria Matrix
          Exec=app
          Icon=insight-matrix
          Categories=Network;InstantMessaging;
          DESKTOP
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/app" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir \
            "dist/insight-matrix-${VERSION}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (zip)
    runs-on: windows-latest
    needs: version
    if: needs.version.outputs.build == 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache do Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/build/**/cargokit_build
          key: rust-${{ runner.os }}-release-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-release-
      - run: flutter pub get
      - run: flutter build windows --release --build-name=${{ needs.version.outputs.semver }} --build-number=${{ github.run_number }}
      - name: Empacotar
        shell: pwsh
        run: |
          $release = 'build\windows\x64\runner\Release'
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "C:\Windows\System32\$dll" $release
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$release\*" -DestinationPath "dist\insight-matrix-$env:VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: app/dist/*.zip
          if-no-files-found: error

  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    needs: version
    if: needs.version.outputs.build == 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache do Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/build/macos/Build/Intermediates.noindex/Pods.build/Release/rust_lib_app.build
          key: rust-${{ runner.os }}-release-${{ hashFiles('app/rust/Cargo.lock') }}
          restore-keys: |
            rust-${{ runner.os }}-release-
      - run: flutter pub get
      - run: flutter build macos --release --build-name=${{ needs.version.outputs.semver }} --build-number=${{ github.run_number }}
      - name: Criar o dmg
        run: |
          mkdir -p dist/dmg
          cp -R build/macos/Build/Products/Release/app.app "dist/dmg/Insight Matrix.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Insight Matrix" -srcfolder dist/dmg -ov \
            -format UDZO "dist/insight-matrix-${VERSION}-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: app/dist/*.dmg
          if-no-files-found: error

  release:
    name: Publicar a Release
    needs: [version, linux, windows, macos]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PREVIOUS: ${{ needs.version.outputs.previous }}
      SHA: ${{ needs.version.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notas da Release
        run: bash .github/scripts/release-notes.sh "$PREVIOUS" "$VERSION" > notes.md
      - name: Criar a Release
        run: |
          gh release create "$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Insight Matrix $VERSION" \
            --notes-file notes.md

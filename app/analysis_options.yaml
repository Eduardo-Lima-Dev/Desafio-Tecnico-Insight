include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - rust_builder/**
    - lib/src/rust/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**

linter:
  rules:
    # App, não biblioteca: documentar todo membro público gera ruído.
    public_member_api_docs: false

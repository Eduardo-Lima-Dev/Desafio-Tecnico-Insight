name: app
description: "Cliente de mensageria desktop com Flutter e Matrix, usando o Matrix Rust SDK pelo Flutter Rust Bridge."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  riverpod_annotation: ^4.0.7
  rust_lib_app:
    path: rust_builder
  shared_preferences: ^2.5.5
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf

# Gera os ícones de macOS e Windows com: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  macos:
    generate: true
    image_path: assets/icon/app_icon.png
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
